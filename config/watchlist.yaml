thresholds:
  # 按 2026 年宽基 ETF 实盘分位数校准（249日中位数约 85.5亿，75%分位 162亿，85%分位 235亿）
  # 全池净申赎金额阈值（亿元）
  strong_flow_yi: 180.0
  medium_flow_yi: 80.0
  # 汇金核心控盘池（占比>=50%核心ETF）净申赎门控阈值（亿元）
  core_strong_yi: 120.0
  core_medium_yi: 50.0
  # 跨宽基换仓识别阈值：双向单边流均 >= 45亿 且 净额明显小于总单边流
  rotation_side_yi: 45.0
  rotation_offset_ratio: 0.45
  # 成交额相对20日中位数放大倍数（抗单日暴量失真）
  volume_strong_ratio: 1.80
  volume_medium_ratio: 1.35
  # 60日价格分位阈值（吸收 Resonance 价格位置门控）
  price_pos_low: 40.0
  price_pos_high: 75.0
  price_pos_extreme_high: 85.0
  # 尾盘30分钟成交占比与相对均量倍数
  tail_share_high: 0.22
  tail_ratio_high: 1.80
  # 开机大号弹窗与 Webhook 告警触发阈值（不乱响、一响即大事）
  alert_flow_yi: 150.0
  alert_score_min: 72
  alert_active_lamps_min: 3
